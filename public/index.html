<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Security Scanner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b14;
      --surface: #0f1522;
      --surface2: #161e30;
      --border: #1c2540;
      --text: #e2e8f0;
      --text2: #64748b;
      --accent: #6366f1;
      --accent2: #818cf8;
      --green: #22c55e;
      --green-bg: rgba(34,197,94,.08);
      --red: #ef4444;
      --red-bg: rgba(239,68,68,.08);
      --gray: #475569;
      --gray-bg: rgba(71,85,105,.1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* grid bg */
    body::before {
      content:''; position:fixed; inset:0; z-index:0;
      background-image:
        linear-gradient(rgba(99,102,241,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events:none;
    }

    .wrap {
      position:relative; z-index:1;
      max-width: 820px; margin:0 auto; padding: 48px 20px 80px;
    }

    /* header */
    header { text-align:center; margin-bottom:40px; }
    header h1 {
      font-size: 2rem; font-weight:800; letter-spacing:-.5px;
      background: linear-gradient(135deg,#818cf8,#6366f1,#a78bfa);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      margin-bottom:8px;
    }
    header p { color:var(--text2); font-size:.88rem; }
    .badge-row {
      display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:14px;
    }
    .badge {
      padding:3px 10px; background:var(--surface); border:1px solid var(--border);
      border-radius:20px; font-size:.72rem; color:var(--text2);
    }

    /* search */
    .search-box {
      display:flex; gap:10px; margin-bottom:20px;
    }
    .search-box input {
      flex:1; padding:13px 18px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; color:var(--text); font-size:.95rem;
      font-family:'Inter',monospace; outline:none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-box input:focus {
      border-color:var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }
    .search-box input::placeholder { color:var(--text2); }
    .search-box button {
      padding:13px 26px; border:none; border-radius:10px;
      background:linear-gradient(135deg,#6366f1,#4f46e5);
      color:#fff; font-size:.92rem; font-weight:600; cursor:pointer;
      transition:transform .1s, box-shadow .2s;
      white-space:nowrap;
    }
    .search-box button:hover { transform:translateY(-1px); box-shadow:0 4px 20px rgba(99,102,241,.35); }
    .search-box button:active { transform:scale(.97); }
    .search-box button:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }

    /* quick */
    .quick-tests {
      display:flex; gap:7px; flex-wrap:wrap; margin-bottom:32px;
    }
    .quick-tests button {
      padding:5px 12px; border:1px solid var(--border);
      background:var(--surface); border-radius:7px;
      color:var(--text2); font-size:.78rem; cursor:pointer;
      font-family:monospace; transition:all .15s;
    }
    .quick-tests button:hover { border-color:var(--accent); color:var(--accent2); }

    /* loading */
    .loading { text-align:center; padding:48px; display:none; }
    .spinner {
      width:36px; height:36px; border:3px solid var(--border);
      border-top-color:var(--accent); border-radius:50%;
      animation:spin .7s linear infinite; margin:0 auto 14px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading p { color:var(--text2); font-size:.88rem; }

    /* result */
    #result { display:none; }

    .result-banner {
      display:flex; align-items:center; gap:16px;
      padding:18px 22px; border-radius:12px; margin-bottom:14px;
    }
    .result-banner.flagged { background:var(--red-bg); border:1px solid rgba(239,68,68,.2); }
    .result-banner.clean   { background:var(--green-bg); border:1px solid rgba(34,197,94,.2); }
    .result-banner .icon { font-size:1.8rem; }
    .result-banner h2 { font-size:1.1rem; font-weight:700; }
    .result-banner p { color:var(--text2); font-size:.82rem; margin-top:2px; }
    .result-banner.flagged h2 { color:var(--red); }
    .result-banner.clean h2   { color:var(--green); }

    /* stats */
    .stats { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .stat {
      flex:1; min-width:100px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:12px 14px; text-align:center;
    }
    .stat .val { font-size:1.4rem; font-weight:700; }
    .stat .lbl { color:var(--text2); font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }
    .stat.red  .val { color:var(--red); }
    .stat.grn  .val { color:var(--green); }
    .stat.blue .val { color:var(--accent2); }

    /* providers */
    .providers { display:grid; gap:8px; }
    .prow {
      display:flex; align-items:center; gap:12px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:12px 16px;
      transition:border-color .15s;
      animation: fadeUp .25s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .prow:hover { border-color:var(--accent); }
    .dot {
      width:10px; height:10px; border-radius:50%; flex-shrink:0;
    }
    .dot.red   { background:var(--red);   box-shadow:0 0 7px rgba(239,68,68,.6); }
    .dot.green { background:var(--green); box-shadow:0 0 7px rgba(34,197,94,.5); }
    .dot.gray  { background:var(--gray); }
    .pname { font-weight:600; font-size:.88rem; min-width:100px; }
    .pstate {
      font-size:.78rem; font-weight:600; padding:2px 9px;
      border-radius:20px; white-space:nowrap;
    }
    .pstate.flagged { background:rgba(239,68,68,.12); color:#f87171; }
    .pstate.clean   { background:rgba(34,197,94,.1);  color:#4ade80; }
    .pstate.error   { background:var(--gray-bg);       color:var(--gray); }

    /* history */
    .history { margin-top:40px; }
    .history h3 { font-size:.75rem; color:var(--text2); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
    .hlist { display:flex; flex-direction:column; gap:5px; }
    .hitem {
      display:flex; align-items:center; gap:10px;
      padding:7px 12px; background:var(--surface);
      border:1px solid var(--border); border-radius:8px;
      cursor:pointer; font-size:.82rem; transition:all .15s;
    }
    .hitem:hover { border-color:var(--accent); }
    .hdot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .hdomain { flex:1; font-family:monospace; }
    .hmeta { color:var(--text2); font-size:.75rem; }

    /* raw json */
    .raw { margin-top:18px; }
    .raw summary { cursor:pointer; color:var(--text2); font-size:.78rem; padding:6px 0; }
    .raw pre {
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:14px; margin-top:6px;
      font-size:.74rem; overflow:auto; color:var(--text2); max-height:360px;
    }

    @media(max-width:540px){
      .search-box { flex-direction:column; }
      header h1 { font-size:1.6rem; }
      .pname { min-width:80px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🛡️ Domain Security Scanner</h1>
      <p>Real-time phishing detection across 14 security providers</p>
      <div class="badge-row">
        <span class="badge">MetaMask</span>
        <span class="badge">Blockaid</span>
        <span class="badge">ChainPatrol</span>
        <span class="badge">PhishFort</span>
        <span class="badge">ScamSniffer</span>
        <span class="badge">CryptoScamDB</span>
        <span class="badge">WalletGuard</span>
        <span class="badge">SEALIntel</span>
        <span class="badge">Phantom</span>
        <span class="badge">PhishDestroy</span>
        <span class="badge">Rabby</span>
        <span class="badge">Rainbow</span>
        <span class="badge">TrustWallet</span>
        <span class="badge">Coinbase</span>
      </div>
    </header>

    <div class="search-box">
      <input type="text" id="domainInput" placeholder="Enter domain — e.g. steakhouse-portal.com" autocomplete="off" spellcheck="false">
      <button id="scanBtn" onclick="scan()">Scan</button>
    </div>

    <div class="quick-tests">
      <button onclick="quickScan('steakhouse-portal.com')">steakhouse-portal.com 🔴</button>
      <button onclick="quickScan('verify-flt.com')">verify-flt.com 🔴</button>
      <button onclick="quickScan('uniswap.org')">uniswap.org ✅</button>
      <button onclick="quickScan('opensea.io')">opensea.io ✅</button>
      <button onclick="quickScan('metamaskk.io')">metamaskk.io 🔴</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loadingText">Scanning across 11 providers...</p>
    </div>

    <div id="result"></div>

    <div class="history" id="historySection" style="display:none">
      <h3>Scan History</h3>
      <div class="hlist" id="historyList"></div>
    </div>
  </div>

  <script>
    const LABELS = {
      metamask:     'MetaMask',
      blockaid:     'Blockaid',
      chainpatrol:  'ChainPatrol',
      phishfort:    'PhishFort',
      scamsniffer:  'ScamSniffer',
      cryptoscamdb: 'CryptoScamDB',
      walletguard:  'WalletGuard',
      seal:         'SEALIntel',
      phantom:      'Phantom',
      phishdestroy: 'PhishDestroy',
      rabby:   'Rabby',
    };

    const history = [];
    const input  = document.getElementById('domainInput');
    const btn    = document.getElementById('scanBtn');
    const loading = document.getElementById('loading');
    const resultDiv = document.getElementById('result');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') scan(); });

    function quickScan(d) { input.value = d; scan(); }

    async function scan() {
      let domain = input.value.trim();
      if (!domain) { input.focus(); return; }
      domain = domain.replace(/^https?:\/\//, '').replace(/\/.*$/, '').replace(/^www\./, '').toLowerCase();
      input.value = domain;

      btn.disabled = true;
      loading.style.display = 'block';
      resultDiv.style.display = 'none';
      document.getElementById('loadingText').textContent = `Scanning ${domain} across 11 providers...`;

      try {
        const res = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ domain }),
        });
        const data = await res.json();
        renderResult(data);
        addHistory(data);
      } catch (err) {
        resultDiv.innerHTML = `<div class="result-banner flagged"><div class="icon">❌</div><div><h2>Error</h2><p>${err.message}</p></div></div>`;
        resultDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
      }
    }

    function renderResult(data) {
      const flagged = data.isAnyFlagged;
      const cls = flagged ? 'flagged' : 'clean';
      const icon = flagged ? '🚨' : '✅';
      const title = flagged ? 'FLAGGED' : 'CLEAN';
      const errorCount = data.errorCount || 0;
      const working = data.totalCount - errorCount;

      let html = `
        <div class="result-banner ${cls}">
          <div class="icon">${icon}</div>
          <div>
            <h2>${data.domain} — ${title}</h2>
            <p>${data.flaggedCount}/${data.totalCount} flagged &nbsp;·&nbsp; ${(data.elapsed/1000).toFixed(1)}s</p>
          </div>
        </div>
        <div class="stats">
          <div class="stat ${flagged ? 'red' : 'grn'}">
            <div class="val">${data.flaggedCount}/${data.totalCount}</div>
            <div class="lbl">Flagged</div>
          </div>
          <div class="stat blue">
            <div class="val">${(data.elapsed/1000).toFixed(1)}s</div>
            <div class="lbl">Scan time</div>
          </div>
          <div class="stat grn">
            <div class="val">${working - data.flaggedCount}</div>
            <div class="lbl">Clean</div>
          </div>
          ${errorCount ? `<div class="stat"><div class="val">${errorCount}</div><div class="lbl">Errors</div></div>` : ''}
        </div>
        <div class="providers">
      `;

      let delay = 0;
      for (const [key, p] of Object.entries(data.providers)) {
        const label = LABELS[key] || key;
        const dotCls = p.flagged ? 'red' : (p.error ? 'gray' : 'green');
        const stateCls = p.flagged ? 'flagged' : (p.error ? 'error' : 'clean');
        const stateText = p.flagged ? 'Flagged' : (p.error ? 'Error' : 'Clean');
        html += `
          <div class="prow" style="animation-delay:${delay}ms">
            <div class="dot ${dotCls}"></div>
            <div class="pname">${label}</div>
            <div style="flex:1"></div>
            <div class="pstate ${stateCls}">${stateText}</div>
          </div>
        `;
        delay += 40;
      }

      html += `</div>
        <details class="raw">
          <summary>Raw JSON</summary>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        </details>
      `;

      resultDiv.innerHTML = html;
      resultDiv.style.display = 'block';
    }

    function addHistory(data) {
      history.unshift(data);
      if (history.length > 20) history.pop();
      const section = document.getElementById('historySection');
      const list    = document.getElementById('historyList');
      section.style.display = 'block';
      list.innerHTML = history.map(d => `
        <div class="hitem" onclick="quickScan('${d.domain}')">
          <div class="hdot" style="background:${d.isAnyFlagged ? 'var(--red)' : 'var(--green)'}"></div>
          <div class="hdomain">${d.domain}</div>
          <div class="hmeta">${d.flaggedCount}/${d.totalCount} flagged &nbsp; ${new Date(d.timestamp).toLocaleTimeString()}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
